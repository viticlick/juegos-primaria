<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explorador del Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EAF5FB; --card:#FFFFFF; --ink:#0F2A43; --ink2:#486377; --line:#C6DFEE;
  --sea:#CFE8F6; --brand:#0F6FB8; --brand-d:#0A4F85; --brand-ink:#FFFFFF; --sun:#FFC93C;
  --ok:#1B9A5F; --ok-bg:#DDF5E8; --bad:#E5483D; --bad-bg:#FDE4E1; --halo:rgba(255,255,255,.88);
  --land-neutral:#DDD3AE; --land-stroke:#FFFFFF; --ocean-hl:#5AAEE9; --lab-o:#0B4F85;
  --c-af:#F4A340; --c-eu:#9B6BD6; --c-as:#EF6F6C; --c-am:#4DBA6B; --c-oc:#F27BB8; --c-an:#EEF6FB;
  --o-pa:#BADFF4; --o-at:#A2D1EF; --o-ind:#B2E6EE; --o-ar:#DDECFA; --o-ant:#D5DEF8;
  --font-d:'Baloo 2',ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;
  --font-b:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1F33; --card:#10304B; --ink:#E8F3FB; --ink2:#9DB8CC; --line:#1F4B6F;
    --sea:#123F63; --brand:#3C9BE0; --brand-d:#1F6FB0; --brand-ink:#04182A; --halo:rgba(10,31,51,.85);
    --ok:#4FD08D; --ok-bg:#12402E; --bad:#FF7D72; --bad-bg:#4A1F23;
    --land-neutral:#8E8C70; --land-stroke:#0A1F33; --ocean-hl:#3C8FD6; --lab-o:#BFE3FF;
    --c-an:#CFE0EE; --o-pa:#174A73; --o-at:#1D5A87; --o-ind:#195B73; --o-ar:#20506F; --o-ant:#27437A;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1F33; --card:#10304B; --ink:#E8F3FB; --ink2:#9DB8CC; --line:#1F4B6F;
  --sea:#123F63; --brand:#3C9BE0; --brand-d:#1F6FB0; --brand-ink:#04182A; --halo:rgba(10,31,51,.85);
  --ok:#4FD08D; --ok-bg:#12402E; --bad:#FF7D72; --bad-bg:#4A1F23;
  --land-neutral:#8E8C70; --land-stroke:#0A1F33; --ocean-hl:#3C8FD6; --lab-o:#BFE3FF;
  --c-an:#CFE0EE; --o-pa:#174A73; --o-at:#1D5A87; --o-ind:#195B73; --o-ar:#20506F; --o-ant:#27437A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-weight:700;font-size:16px;line-height:1.45;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);font-weight:800;line-height:1.1;margin:0}
p{margin:0}
#app{max-width:720px;margin:0 auto;padding:14px 14px 40px}

/* chunky buttons */
.btn{border:0;border-radius:999px;padding:12px 22px;min-height:48px;font-family:var(--font-d);font-weight:700;font-size:1.1rem;background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--brand);color:var(--brand-ink);box-shadow:0 4px 0 var(--brand-d)}
.btn.primary:active{box-shadow:0 1px 0 var(--brand-d)}
.btn.wide{width:100%}
.btn.small{min-height:40px;padding:8px 16px;font-size:1rem}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.row.sb{justify-content:space-between}

/* home */
.hero{text-align:center;padding:6px 0 4px}
.hero h1{font-size:clamp(2rem,8vw,2.9rem);letter-spacing:-.01em}
.hero .sub{color:var(--ink2);margin:4px 0 12px}
.pill{display:inline-block;min-height:34px;margin-top:10px;padding:6px 14px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-size:.95rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px}
.rank{margin:14px 0}
.rank .who{font-family:var(--font-d);font-size:1.25rem;font-weight:800}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.stats{display:flex;gap:14px;font-size:.95rem;color:var(--ink2);margin-top:8px}
.set{margin:14px 0 6px}
.set h3{font-size:1rem;margin-bottom:6px;color:var(--ink2);font-family:var(--font-b);font-weight:800}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:.95rem;padding:6px 4px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.note{font-size:.88rem;color:var(--ink2);margin-top:6px;font-weight:600}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.mode{display:flex;flex-direction:column;gap:2px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:12px;min-height:116px;box-shadow:0 4px 0 var(--line)}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mode .em{font-size:1.8rem;line-height:1}
.mode b{font-family:var(--font-d);font-size:1.15rem;font-weight:800;line-height:1.1;margin-top:6px}
.mode span.d{font-size:.88rem;color:var(--ink2);font-weight:600;line-height:1.25}
.mode.full{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:12px}
.mode.full .em{font-size:2.2rem}

/* game chrome */
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top .x{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.1rem}
.prog{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s;border-radius:99px}
.hud{flex:none;font-family:var(--font-d);font-weight:800;font-size:1.1rem;white-space:nowrap}
.hud .k{margin-left:6px}
.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.3)}}

/* map */
.mapwrap{position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--line);background:var(--sea);touch-action:none;user-select:none;-webkit-user-select:none}
.mapwrap.static{touch-action:auto}
.map{display:block;width:100%;height:auto}
.sea{fill:var(--sea)}
.ocean{fill:var(--sea);transition:opacity .25s}
.map.lv1 .o-pa{fill:var(--o-pa)} .map.lv1 .o-at{fill:var(--o-at)} .map.lv1 .o-ind{fill:var(--o-ind)} .map.lv1 .o-ar{fill:var(--o-ar)} .map.lv1 .o-ant{fill:var(--o-ant)}
.land{fill:var(--land-neutral);stroke:var(--land-stroke);stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:opacity .25s}
.map.lv1 .c-af,.map.lv2 .c-af{fill:var(--c-af)} .map.lv1 .c-eu,.map.lv2 .c-eu{fill:var(--c-eu)} .map.lv1 .c-as,.map.lv2 .c-as{fill:var(--c-as)}
.map.lv1 .c-am,.map.lv2 .c-am{fill:var(--c-am)} .map.lv1 .c-oc,.map.lv2 .c-oc{fill:var(--c-oc)} .map.lv1 .c-an,.map.lv2 .c-an{fill:var(--c-an)}
.map.focus .land:not(.hl){opacity:.3}
.map.focus .ocean:not(.hl){opacity:.5}
.map .land.hl{stroke:var(--sun);stroke-width:3.5;animation:pulseL 1.1s ease-in-out infinite}
.map .ocean.hl{fill:var(--ocean-hl);animation:pulseO 1.1s ease-in-out infinite}
.map .land.hl.ok{stroke:var(--ok);animation:none}
.map .land.bad{stroke:var(--bad);stroke-width:3.5}
.map .ocean.bad{fill:var(--bad)}
@keyframes pulseL{50%{filter:brightness(1.18)}}
@keyframes pulseO{50%{opacity:.7}}
.lab{text-anchor:middle;dominant-baseline:middle;font-family:var(--font-d);font-weight:800;fill:var(--ink);stroke:var(--halo);stroke-width:.3em;paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.lab.o{fill:var(--lab-o);font-style:italic}
.zoomui{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.zoomui button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.15rem;line-height:1;font-weight:800;padding:0}
.hero .land{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}

/* panels */
.panel{margin-top:12px}
.ask{color:var(--ink2);font-size:.95rem}
.target{font-size:clamp(1.5rem,6.5vw,2rem);margin:2px 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spk{border:2px solid var(--line);background:var(--card);border-radius:50%;width:42px;height:42px;font-size:1.1rem;padding:0}
.msg{min-height:1.5em;color:var(--ink2);font-size:.95rem}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.opt{min-height:54px;text-align:left;padding:10px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-family:var(--font-d);font-size:1.15rem;font-weight:700;box-shadow:0 3px 0 var(--line)}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);box-shadow:none}
.opt[disabled]{opacity:.6}
.field{display:flex;gap:8px;margin-top:8px}
.field input{flex:1;min-width:0;min-height:52px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 1.2rem var(--font-b);padding:8px 14px}
.hint{margin-top:8px;font-size:.95rem;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:46px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-family:var(--font-d);font-weight:700;font-size:1.05rem;box-shadow:0 3px 0 var(--line)}
.chip[aria-pressed="true"]{background:var(--sun);color:#3A2A00;border-color:var(--sun)}
.fb{border-radius:20px;padding:14px;border:2px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fbh{display:flex;gap:12px;align-items:center}
.fbi{font-size:2rem}
.fbh b{font-family:var(--font-d);font-size:1.3rem;font-weight:800;line-height:1.15}
.pts{display:block;font-size:.95rem;color:var(--ink2);font-weight:700}
.fact{margin:10px 0 12px;font-weight:600}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}

/* learn */
.info .head{display:flex;align-items:center;gap:12px}
.info .big{font-size:2.6rem;line-height:1}
.info h2{font-size:1.6rem}
.info ul{margin:10px 0 0;padding-left:20px;font-weight:600}
.info li{margin:4px 0}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

/* result + progress */
.res{text-align:center;padding:10px 0}
.stars{font-size:3rem;letter-spacing:6px}
.res h2{font-size:2rem;margin:6px 0}
.big-score{font-family:var(--font-d);font-size:2.6rem;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 14px}
.tag{padding:6px 12px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-size:.95rem}
.tag.new{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 25%,var(--card))}
.prow{display:grid;grid-template-columns:34px 1fr 90px;gap:10px;align-items:center;padding:8px 0;border-bottom:2px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .e{font-size:1.5rem}
.prow .n{font-family:var(--font-d);font-weight:700;font-size:1.05rem;line-height:1.15}
.prow .s{font-size:.82rem;color:var(--ink2);font-weight:600}
.prow .bar{margin:0;height:10px}
.prow .bar>i{background:var(--ok)}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.badge{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:14px;border:2px solid var(--line);font-size:.9rem;line-height:1.2}
.badge .e{font-size:1.5rem}
.badge.off{opacity:.45;filter:grayscale(1)}
.gap{height:12px}

@media (min-width:600px){
  .opts{grid-template-columns:1fr 1fr}
  .modes{grid-template-columns:repeat(3,1fr)}
  .mode.full{grid-column:1/-1}
}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:calc(100% - 32px);padding:12px 18px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:700;font-size:.95rem;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* móvil */
@media (max-width:600px){
  #app{padding:10px 10px 32px}
  .mapwrap{margin:0 -4px;border-radius:16px}
  .zoomui button{width:46px;height:46px;font-size:1.3rem}
  .opt{min-height:58px}
}
#mapslot::after{content:"👆 Arrastra el mapa para moverte, o gira el móvil para verlo entero";display:none;margin-top:8px;text-align:center;font-size:.9rem;font-weight:700;color:var(--ink2)}
@media (max-width:600px) and (orientation:portrait){#mapslot::after{display:block}}
@media (max-height:500px) and (orientation:landscape){#app{max-width:none;padding:8px 14px 24px}}
</style>
</head>

    while(k<pool.length-1&&r>w[k]){r-=w[k];k++;}
    out.push(pool.splice(k,1)[0]);
  }
  return out;
}
function pickTargets(pool,n){
  const out=[];
  for(let i=0;i<n;i++){
    const recent=out.slice(-Math.max(1,Math.min(pool.length-1,4)));
    const cand=pool.filter(x=>!recent.includes(x));
    out.push(wpick(cand,1,x=>x)[0]);
  }
  return out;
}

/* ---------- mapa ---------- */
function makeMap(o={}){
  const lv=o.level||S.level;
  let h=`<svg class="map lv${lv}" viewBox="0 0 ${D.W} ${D.H}" role="img" aria-label="Mapa del mundo" preserveAspectRatio="xMidYMid meet">`;
  h+=`<rect class="sea" width="${D.W}" height="${D.H}"/>`;
  for(const k in D.oceans){const id=k.startsWith('pa')?'pa':k;h+=`<path class="ocean o-${id}" data-reg="${id}" d="${D.oceans[k]}"/>`;}
  let n=0;
  for(const k in D.land){h+=`<path class="land c-${k}" data-key="${k}" data-reg="${k}" style="animation-delay:${(n++)*.12}s" d="${D.land[k]}"/>`;}
  h+=`<g class="labels"></g></svg>`;
  const wrap=document.createElement('div');
  wrap.className='mapwrap'+(o.static?' static':'');
  wrap.innerHTML=h+(o.static?'':`<div class="zoomui"><button type="button" data-z="in" aria-label="Acercar">+</button><button type="button" data-z="out" aria-label="Alejar">−</button><button type="button" data-z="reset" aria-label="Ver todo el mapa">⟲</button></div>`);
  const svg=$('svg',wrap),lab=$('.labels',svg);
  const vb={x:0,y:0,w:D.W,h:D.H};
  const MINW=D.W/6;
  /* en móvil vertical el mapa se hace más alto (y se arrastra) en vez de verse diminuto */
  const mq=!o.static&&window.matchMedia?matchMedia('(max-width:600px) and (orientation:portrait)'):null;
  const asp=()=>mq&&mq.matches?0.8:D.H/D.W;
  const wmax=()=>Math.min(D.W,D.H/asp());
  const rect=()=>svg.getBoundingClientRect();
  function fit(){const cw=rect().width||360;const px=cw<520?11:13;lab.style.fontSize=(px*vb.w/cw)+'px';}
  function apply(){
    vb.w=Math.min(wmax(),Math.max(MINW,vb.w));vb.h=vb.w*asp();
    vb.x=Math.min(Math.max(0,vb.x),D.W-vb.w);vb.y=Math.min(Math.max(0,vb.y),D.H-vb.h);
    svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);fit();
  }
  const ux=cx=>vb.x+(cx-rect().left)/rect().width*vb.w;
  const uy=cy=>vb.y+(cy-rect().top)/rect().height*vb.h;
  function zoomAt(f,cx,cy){
    const nw=Math.min(wmax(),Math.max(MINW,vb.w/f));
    vb.x=cx-(cx-vb.x)*(nw/vb.w);vb.y=cy-(cy-vb.y)*(nw/vb.w);vb.w=nw;apply();
  }
  let raf=0;
  function animTo(t,ms=320){
    cancelAnimationFrame(raf);const s={...vb},t0=performance.now();
    const step=now=>{const k=Math.min(1,(now-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      vb.x=s.x+(t.x-s.x)*e;vb.y=s.y+(t.y-s.y)*e;vb.w=s.w+(t.w-s.w)*e;apply();
      if(k<1)raf=requestAnimationFrame(step);};
    raf=requestAnimationFrame(step);
  }
  const api={el:wrap,svg,onTap:o.onTap||null};
  api.reset=(anim)=>{const w=wmax(),t={x:(D.W-w)/2,y:(D.H-w*asp())/2,w};if(anim)animTo(t);else{Object.assign(vb,t);apply();}};
  api.zoomTo=id=>{const p=D.labels[id];const w=Math.min(wmax(),id==='an'?D.W/1.6:D.W/(isOcean(id)?1.8:2.2));animTo({x:p[0]-w/2,y:p[1]-w*asp()/2,w});};
  api.setFocus=id=>{svg.classList.toggle('focus',!!id);$$('[data-reg]',svg).forEach(p=>{p.classList.toggle('hl',!!id&&p.dataset.reg===id);p.classList.remove('ok');});};
  api.mark=(id,cls,ms)=>{$$('[data-reg]',svg).forEach(p=>{if(p.dataset.reg===id){p.classList.add(cls);if(ms)setTimeout(()=>p.classList.remove(cls),ms);}});};
  api.showLabels=ids=>{
    lab.innerHTML=ids.map(id=>{const p=D.labels[id];return `<text class="lab ${isOcean(id)?'o':''}" x="${p[0]}" y="${p[1]}">${INFO[id].short}</text>`;}).join('');fit();
  };
  api.fit=fit;
  if(o.static){
    svg.addEventListener('click',e=>{const p=e.target.closest('[data-reg]');if(p&&api.onTap)api.onTap(p.dataset.reg,p);});
  }else{
    const ptrs=new Map();let drag=null,moved=false,pinch=null;
    svg.addEventListener('pointerdown',e=>{
      ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};moved=false;}
      else if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),w:vb.w};moved=true;}
    });
    svg.addEventListener('pointermove',e=>{
      if(!ptrs.has(e.pointerId))return;
      ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(ptrs.size===2&&pinch){
        const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y)||1;
        const f=vb.w/(pinch.w*pinch.d/d);zoomAt(f,ux((a.x+b.x)/2),uy((a.y+b.y)/2));
      }else if(drag&&ptrs.size===1){
        const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
        if(!moved&&Math.hypot(dx,dy)>7)moved=true;
        if(moved){const k=vb.w/rect().width;vb.x=drag.vx-dx*k;vb.y=drag.vy-dy*k;apply();}
      }
    });
    const end=e=>{
      if(!ptrs.has(e.pointerId))return;
      const single=ptrs.size===1;ptrs.delete(e.pointerId);
      if(e.type==='pointerup'&&single&&!moved){
        const p=document.elementFromPoint(e.clientX,e.clientY);const r=p&&p.closest&&p.closest('[data-reg]');
        if(r&&svg.contains(r)&&api.onTap)api.onTap(r.dataset.reg,r);
      }
      if(ptrs.size<2)pinch=null;if(ptrs.size===0)drag=null;
    };
    svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
    wrap.addEventListener('click',e=>{
      const b=e.target.closest('[data-z]');if(!b)return;
      const cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;
      if(b.dataset.z==='in')zoomAt(1.6,cx,cy);else if(b.dataset.z==='out')zoomAt(1/1.6,cx,cy);else api.reset(true);
    });
  }
  if(mq){let last=mq.matches;api.reset(false);window.addEventListener('resize',()=>{if(!svg.isConnected)return;if(mq.matches!==last){last=mq.matches;api.reset(false);}else apply();});}
  if(window.ResizeObserver)new ResizeObserver(fit).observe(svg);
  requestAnimationFrame(fit);
  return api;
}

/* ---- juego ---- */
function buildQs(mode){
  const N=10,pool=items();
  if(mode==='label')return[{type:'label'}];
  const bank=()=>FACTS.filter(f=>S.topic==='all'||(S.topic==='cont')===(f.k==='c')).map(f=>({type:'facts',q:f.q,why:f.why,target:f.a,attempts:0}));
  if(mode==='facts')return wpick(bank(),N,q=>q.target);
  const tg=pickTargets(pool,N);
  const types=mode==='mix'?shuffle(['locate','locate','name','name','type','type','facts','name','locate','type']):Array(N).fill(mode);
  return tg.map((t,i)=>{
    let ty=types[i];
    if(ty==='facts'){const b=bank().filter(f=>f.target===t);if(b.length)return rnd(b);ty='name';}
    return{type:ty,target:t,attempts:0};
  });
}
function play(mode){
  G={mode,i:0,score:0,streak:0,maxStreak:0,ok:0,errs:{},qs:buildQs(mode),mistakes:0};
  app.innerHTML=`
  <div class="top"><button type="button" class="x" id="back" aria-label="Salir al menú">✕</button><div class="prog"><i id="pg"></i></div><div class="hud"><span id="hs">⭐ 0</span><span class="k" id="hk"></span></div></div>
  <div id="mapslot"></div>
  <section class="panel" id="panel"></section>`;
  map=makeMap({});$('#mapslot').appendChild(map.el);
  map.onTap=(r,p)=>tapHandler&&tapHandler(r,p);
  $('#back').onclick=()=>{tapHandler=null;home();};
  nextQ();
}
const panelEl=()=>$('#panel');
function hud(bump){
  const s=$('#hs'),k=$('#hk');if(!s)return;
  s.textContent='⭐ '+G.score;k.textContent=G.streak>=2?'🔥 '+G.streak:'';
  if(bump){s.classList.remove('bump');void s.offsetWidth;s.classList.add('bump');}
  $('#pg').style.width=Math.round((G.mode==='label'?(G.placed||0)/items().length:G.i/G.qs.length)*100)+'%';
}
function shake(){const p=panelEl();p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');}
function nextQ(){
  tapHandler=null;map.setFocus(null);map.showLabels([]);map.reset();
  const q=G.qs[G.i];hud();
  ({locate:qLocate,name:qChoice,facts:qChoice,type:qType,label:qLabel})[q.type](q);
  panelEl().scrollIntoView({block:'nearest',behavior:'smooth'});
}
function award(q,how){
  const base={first:10,near:8,second:5,fail:0}[how];
  if(base>0)G.streak++;else G.streak=0;
  const bonus=base>0?Math.min(10,Math.max(0,G.streak-2)*2):0;
  G.maxStreak=Math.max(G.maxStreak,G.streak);G.score+=base+bonus;
  G.ok+=how==='first'||how==='near'?1:how==='second'?.5:0;
  upd(q.target,{first:1,near:.9,second:.5,fail:0}[how]);
  if(how==='fail')G.errs[q.target]=1;
  hud(base>0);
  return base+bonus;
}
function feedback(q,how,msg){
  q.done=true;tapHandler=null;
  map.setFocus(q.target);if(how!=='fail')map.mark(q.target,'ok');map.showLabels([q.target]);
  const pts=award(q,how),good=how!=='fail',last=G.i===G.qs.length-1;
  const fact=q.why||rnd(INFO[q.target].facts);
  panelEl().innerHTML=`<div class="fb ${good?'ok':'bad'}"><div class="fbh"><span class="fbi">${good?'🎉':'🤔'}</span><div><b>${msg}</b><span class="pts">${good?'+'+pts+' puntos':'Esta la repasamos otro día'}</span></div></div><p class="fact">💡 ${fact}</p><button type="button" class="btn primary wide" id="nx">${last?'Ver resultado':'Siguiente'}</button></div>`;
  $('#nx').onclick=()=>{G.i++;if(G.i>=G.qs.length)result();else nextQ();};
  panelEl().scrollIntoView({block:'nearest',behavior:'smooth'});
}
const cheer=()=>rnd(['¡Muy bien!','¡Exacto!','¡Perfecto!','¡Eso es!','¡Genial!']);

function qLocate(q){
  const I=INFO[q.target];
  panelEl().innerHTML=`<p class="ask">Toca en el mapa:</p><h2 class="target">${I.full}<button type="button" class="spk" id="sp" aria-label="Escuchar">🔊</button></h2><p class="msg" id="msg">${isOcean(q.target)?'Los océanos son las zonas azules.':'Puedes acercar el mapa con + y −.'}</p>`;
  $('#sp').onclick=()=>speak(I.full);
  tapHandler=(r,p)=>{
    if(r===q.target){feedback(q,q.attempts===0?'first':'second',q.attempts===0?cheer():'¡Bien, a la segunda!');return;}
    q.attempts++;map.mark(r,'bad',700);shake();
    if(q.attempts>=2){feedback(q,'fail',`Era ${I.full}. Mira cómo se ilumina.`);return;}
    $('#msg').textContent=`Ahí está ${INFO[r].full}. ¡Prueba otra vez!`;

}
function qChoice(q){
  const I=INFO[q.target],ocean=isOcean(q.target);
  const isF=q.type==='facts';
  map.setFocus(isF?null:q.target);
  const g=group(q.target),opts=shuffle([q.target,...shuffle(g.filter(x=>x!==q.target)).slice(0,Math.min(nOpts(),g.length)-1)]);
  panelEl().innerHTML=`<h2 class="target" style="font-size:1.35rem">${isF?q.q:(ocean?'¿Qué océano está marcado en el mapa?':'¿Qué continente está marcado en el mapa?')}</h2><p class="msg" id="msg"></p><div class="opts">${opts.map(o=>`<button type="button" class="opt" data-id="${o}">${INFO[o].full}</button>`).join('')}</div>`;
  $$('.opt').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;

    if(q.attempts>=2){feedback(q,'fail',`Era ${I.full}.`);return;}
    $('#msg').textContent='Casi… ¡prueba otra vez!';
  });
}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim().replace(/^((el|la|oceano|continente) )+/,'').trim();
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function qType(q){
  const I=INFO[q.target],ocean=isOcean(q.target);
  map.setFocus(q.target);
  q.hinted=false;
  panelEl().innerHTML=`<h2 class="target" style="font-size:1.35rem">${ocean?'¿Cómo se llama este océano?':'¿Cómo se llama este continente?'}</h2><div class="field"><input id="in" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Escribe el nombre" placeholder="Escribe aquí"><button type="button" class="btn primary" id="ok">Comprobar</button></div><p class="msg" id="msg">${ocean?'No hace falta escribir «océano».':''}</p>${S.level<3?'<button type="button" class="btn small" id="hb">💡 Pista</button>':''}<p class="hint" id="ht"></p>`;
  const inp=$('#in');setTimeout(()=>{try{inp.focus({preventScroll:true});}catch(e){}},50);
  const showHint=()=>{q.hinted=true;const c=I.core;$('#ht').textContent=`Empieza por «${c[0]}» y tiene ${c.length} letras.`;};
  if($('#hb'))$('#hb').onclick=showHint;
  const check=()=>{
    const a=norm(inp.value);if(!a)return;
    const syn=SYN[q.target];
    const exact=syn.includes(a);
    const near=!exact&&syn.some(s=>lev(a,s)<=(s.length>=9?2:s.length>=5?1:0));
    if(exact||near){
      const how=near?'near':(q.attempts===0&&!q.hinted?'first':'second');
      feedback(q,how,near?`¡Casi! Se escribe «${I.core}».`:(how==='first'?cheer():'¡Bien!'));return;
    }
    q.attempts++;shake();
    if(q.attempts>=2){feedback(q,'fail',`Se escribe «${I.core}».`);return;}
    $('#msg').textContent='Hmm, no es ese. ¡Inténtalo otra vez!';
    if(S.level===1)showHint();
  };
  $('#ok').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
}
function qLabel(q){
  const list=items();let sel=null,placed=[];const errs={};G.placed=0;
  function paint(){
    const left=shuffle0(list.filter(x=>!placed.includes(x)));
    panelEl().innerHTML=`<h2 class="target" style="font-size:1.3rem">Elige un nombre y toca su lugar en el mapa</h2><p class="msg" id="msg">Faltan ${left.length}</p><div class="chips">${left.map(id=>`<button type="button" class="chip" data-id="${id}" aria-pressed="${sel===id}">${INFO[id].full}</button>`).join('')}</div><div class="gap"></div><button type="button" class="btn small" id="hb">💡 Pista (−3 puntos)</button>`;
    $$('.chip').forEach(c=>c.onclick=()=>{sel=sel===c.dataset.id?null:c.dataset.id;paint();});
    $('#hb').onclick=()=>{if(!sel){$('#msg').textContent='Primero elige un nombre.';return;}G.mistakes++;errs[sel]=1;G.errs[sel]=1;map.mark(sel,'bad',900);hud();};
  }
  const order=shuffle(list);const shuffle0=a=>a.slice().sort((x,y)=>order.indexOf(x)-order.indexOf(y));
  paint();hud();
  tapHandler=(r,p)=>{
    if(!sel){$('#msg').textContent='Primero elige un nombre de la lista.';return;}
    if(r===sel){
      placed.push(sel);upd(sel,errs[sel]?.4:1);G.placed=placed.length;G.score=Math.max(0,placed.length*10-G.mistakes*3);
      map.showLabels(placed);sel=null;hud(true);
      if(placed.length===list.length){tapHandler=null;setTimeout(result,500);return;}
      paint();
    }else{
      G.mistakes++;errs[sel]=1;G.errs[sel]=1;map.mark(r,'bad',700);shake();G.score=Math.max(0,placed.length*10-G.mistakes*3);hud();
      $('#msg').textContent=`Ahí está ${INFO[r].full}. ¡Prueba otra vez!`;
    }
  };
}

function result(){
  tapHandler=null;
  const label=G.mode==='label',N=label?items().length:G.qs.length;
  const acc=label?N/(N+G.mistakes):G.ok/N;
  const stars=acc>=.9?3:acc>=.7?2:acc>=.4?1:0;
  const before=rankInfo().i;
  S.xp+=G.score;S.stars+=stars;S.rounds++;S.bestStreak=Math.max(S.bestStreak,G.maxStreak);
  const got=[],add=id=>{if(!S.badges.includes(id)){S.badges.push(id);got.push(id);}};
  if(G.ok>0||(label&&G.placed>0))add('first');
  if(G.maxStreak>=5)add('streak5');
  if(label&&G.mistakes===0)add('map');
  if(G.mode==='mix'&&acc>=.9)add('mix');
  if(conts().every(i=>mast(i)>=.7))add('cont');
  if(oceans.every(i=>mast(i)>=.7))add('ocean');
  if(items('all').every(i=>mast(i)>=.85))add('master');
  save();
  const up=rankInfo().i>before;
  const rev=Object.keys(G.errs);
  const msg=stars===3?'¡Increíble!':stars===2?'¡Muy bien!':stars===1?'¡Buen intento!':'¡Sigue practicando!';
  app.innerHTML=`<div class="res"><div class="stars" aria-label="${stars} estrellas">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><h2>${msg}</h2>
  <div class="big-score">${G.score} puntos</div>
  <p class="ask">${label?`Colocaste ${N} etiquetas con ${G.mistakes} fallos`:`Acertaste ${Math.round(acc*100)}% · mejor racha ${G.maxStreak}`}</p>
  ${up?`<p class="pill">🎖️ ¡Ahora eres ${rankInfo().cur[1]}!</p>`:''}
  ${got.length?`<div class="tags">${got.map(b=>`<span class="tag new">${BADGES[b][0]} Nueva insignia: ${BADGES[b][1]}</span>`).join('')}</div>`:''}
  ${rev.length?`<p class="ask">Para repasar:</p><div class="tags">${rev.map(i=>`<span class="tag">${INFO[i].emoji} ${INFO[i].full}</span>`).join('')}</div>`:''}
  <div class="gap"></div><button type="button" class="btn primary wide" id="again">Jugar otra vez</button><div class="gap"></div><button type="button" class="btn wide" id="menu">Volver al menú</button></div>`;
  const mode=G.mode;
  $('#again').onclick=()=>play(mode);$('#menu').onclick=home;
}

function progress(){
  const list=items('all');
  const done=list.filter(i=>mast(i)>=.7).length;
  app.innerHTML=`
  <div class="top"><button type="button" class="x" id="back" aria-label="Volver al menú">✕</button><h2 style="flex:1">Mi progreso</h2></div>
  <section class="card"><div class="row sb"><b>Dominados</b><b>${done} de ${list.length}</b></div><div class="bar"><i style="width:${Math.round(done/list.length*100)}%"></i></div>
  ${list.map(id=>{const m=mast(id),n=(S.prog[id]||{}).n||0;return`<div class="prow"><span class="e">${INFO[id].emoji}</span><div><div class="n">${INFO[id].full}</div><div class="s">${n===0?'Nuevo':m>=.7?'¡Dominado!':'Practicando'}</div></div><div class="bar"><i style="width:${Math.round(Math.min(1,m/.7)*100)}%"></i></div></div>`;}).join('')}</section>
  <div class="gap"></div>
  <section class="card"><b>Insignias</b><div class="badges">${Object.keys(BADGES).map(b=>`<div class="badge ${S.badges.includes(b)?'':'off'}"><span class="e">${BADGES[b][0]}</span>${BADGES[b][1]}</div>`).join('')}</div></section>
  <div class="gap"></div><button type="button" class="btn wide" id="rs">Borrar mi progreso</button>`;
  $('#back').onclick=home;
  let armed=false;
  $('#rs').onclick=()=>{
    if(!armed){armed=true;$('#rs').textContent='¿Seguro? Toca otra vez para borrar';return;}
    S=JSON.parse(JSON.stringify(DEF));save();home();
  };
}

home();
})();
</script>
</body>
</html>
